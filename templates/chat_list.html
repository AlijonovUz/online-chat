<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <title>Chatlar</title>

  <style>
    .soft-scroll::-webkit-scrollbar { width: 10px; }
    .soft-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 999px; border: 2px solid #fff; }
    .soft-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>

<body class="bg-slate-100">
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200/60">

    <div class="sticky top-0 z-10 px-5 py-4 border-b bg-white/90 backdrop-blur flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center">
          <i data-lucide="messages-square" class="w-5 h-5 text-slate-700"></i>
        </div>
        <div class="leading-tight">
          <div class="text-base font-semibold text-slate-900">Chatlar</div>
          <div class="text-xs text-slate-500">Siz: <span class="font-medium">{{ me_name }}</span></div>
        </div>
      </div>

      <form method="post" action="/accounts/logout/">
        {% csrf_token %}
        <button
          type="submit"
          class="w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 border border-slate-200 flex items-center justify-center transition active:scale-[0.98]"
          title="Chiqish"
        >
          <i data-lucide="log-out" class="w-5 h-5 text-slate-700"></i>
        </button>
      </form>
    </div>

    <div class="p-4 border-b bg-white">
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </span>

        <input
          id="search"
          class="w-full pl-10 pr-11 py-3 rounded-2xl border border-slate-200 bg-white
                 focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-300
                 placeholder:text-slate-400"
          placeholder="Ism yoki username bo‘yicha qidirish..."
          autocomplete="off"
        />

        <button
          id="clearSearch"
          type="button"
          class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl
                 hover:bg-slate-100 text-slate-500 flex items-center justify-center transition"
          title="Tozalash"
        >
          <i data-lucide="x" class="w-4.5 h-4.5"></i>
        </button>
      </div>

      <div id="counter" class="mt-2 text-xs text-slate-500"></div>
    </div>

    <!-- List -->
    <div id="list" class="max-h-[70vh] overflow-y-auto divide-y soft-scroll">
      {% for u in users %}
      <a
        href="{% url 'private_chat' u.id %}"
        class="group flex items-center gap-3 px-5 py-4 hover:bg-slate-50 transition user-row"
        data-name="{{ u.name|lower }} {{ u.username|lower }}"
      >
        <!-- Avatar -->
        <div class="relative shrink-0">
          <div class="w-12 h-12 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center
                      group-hover:border-slate-300 transition">
            <i data-lucide="user" class="w-5 h-5 text-slate-700"></i>
          </div>

          {% if u.online %}
          <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-emerald-500 border-[3px] border-white rounded-full"></span>
          {% endif %}
        </div>

        <!-- Info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-3">
            <div class="font-semibold text-slate-900 truncate">
              {{ u.name }}
            </div>

            {% if u.online %}
            <div class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-full">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              onlayn
            </div>
            {% else %}
            <div class="text-xs text-slate-400">yaqinda onlayn edi</div>
            {% endif %}
          </div>

          <div class="mt-0.5 text-sm text-slate-500 truncate">
            @{{ u.username }}
          </div>
        </div>

        <!-- Arrow -->
        <div class="shrink-0 text-slate-400 group-hover:text-slate-600 transition">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </div>
      </a>
      {% empty %}
      <div class="p-10 text-center">
        <div class="mx-auto w-14 h-14 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center">
          <i data-lucide="users" class="w-6 h-6 text-slate-600"></i>
        </div>
        <div class="mt-3 font-semibold text-slate-900">Hozircha user yo‘q</div>
        <div class="mt-1 text-sm text-slate-500">Keyinroq qayta urinib ko‘ring.</div>
      </div>
      {% endfor %}
    </div>

  </div>
</div>

<script>
  lucide.createIcons();

  const search = document.getElementById("search");
  const clearBtn = document.getElementById("clearSearch");
  const counter = document.getElementById("counter");
  const rows = Array.from(document.querySelectorAll(".user-row"));

  function applyFilter() {
    const q = (search.value || "").trim().toLowerCase();
    let visible = 0;

    rows.forEach(r => {
      const hay = (r.dataset.name || "");
      const ok = hay.includes(q);
      r.style.display = ok ? "flex" : "none";
      if (ok) visible++;
    });

    clearBtn.classList.toggle("hidden", q.length === 0);

    if (rows.length > 0) {
      counter.textContent = q
        ? `Topildi: ${visible} ta`
        : `Jami: ${rows.length} ta`;
    } else {
      counter.textContent = "";
    }
  }

  search.addEventListener("input", applyFilter);

  clearBtn.addEventListener("click", () => {
    search.value = "";
    applyFilter();
    search.focus();
  });

  applyFilter();
</script>
</body>
</html>
