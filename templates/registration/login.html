<!doctype html>
<html lang="uz">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <title>Tizimga kirish</title>

    <link href="{% static 'images/favicon.ico' %}" rel="icon">

</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <!-- Header -->
    <div class="text-center mb-8">
        <div class="flex justify-center mb-4">
            <div class="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center">
                <i data-lucide="shield-check" class="w-7 h-7 text-slate-900"></i>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Tizimga kirish</h2>
        <p class="text-sm text-slate-500 mt-2">
            Ijtimoiy tarmoq orqali tez va xavfsiz kirish
        </p>
    </div>

    <div class="space-y-4">

        <!-- Google -->
        <form action="/accounts/google/login/" method="post" class="provider-form">
            {% csrf_token %}
            <button type="submit"
                    class="w-full flex items-center justify-center gap-3 py-3 rounded-xl border border-slate-300
                      bg-white hover:bg-slate-50 transition shadow-sm hover:shadow-md">

                <svg class="w-5 h-5" viewBox="0 0 48 48">
                    <path fill="#EA4335"
                          d="M24 9.5c3.54 0 6.74 1.22 9.25 3.6l6.9-6.9C35.6 2.3 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l8.1 6.3C12.6 13 17.9 9.5 24 9.5z"/>
                    <path fill="#34A853"
                          d="M46.1 24.5c0-1.7-.2-3.3-.6-4.8H24v9.1h12.4c-.5 2.9-2.2 5.3-4.7 7l7.2 5.6c4.2-3.9 7.2-9.7 7.2-16.9z"/>
                    <path fill="#FBBC05"
                          d="M10.6 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-8.1-6.3C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.9l8.1-6.3z"/>
                    <path fill="#4285F4"
                          d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.2-5.6c-2 1.3-4.6 2.1-8 2.1-6.1 0-11.4-3.5-13.4-8.6l-8.1 6.3C6.4 42.6 14.6 48 24 48z"/>
                </svg>

                <span class="font-medium text-slate-700">
                    Google orqali kirish
                </span>
            </button>
        </form>
    </div>

    <!-- Divider -->
    <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="px-3 text-xs text-slate-400 uppercase tracking-wider">Xavfsiz kirish</span>
        <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <p class="text-center text-xs text-slate-500">
        Kirish orqali siz foydalanish shartlariga rozilik bildirasiz.
    </p>

</div>

<script>
    lucide.createIcons();
</script>

</body>
</html>
