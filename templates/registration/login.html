<!doctype html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Tizimga kirish</title>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <div class="text-center mb-8">
        <div class="flex justify-center mb-4">
            <i data-lucide="shield-check" class="w-10 h-10 text-slate-900"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Tizimga kirish</h2>
        <p class="text-sm text-slate-500 mt-2">
            Hisobingizga kirish uchun ma'lumotlarni kiriting
        </p>
    </div>

    {% if form.errors %}
    <div class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 text-sm flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4"></i>
        Foydalanuvchi nomi yoki parol noto‘g‘ri
    </div>
    {% endif %}

    <form method="post" class="space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
                Foydalanuvchi nomi
            </label>
            <div class="relative">
          <span class="absolute left-3 top-3 text-slate-400">
            <i data-lucide="user" class="w-5 h-5"></i>
          </span>
                <input type="text" name="username"
                       class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-900"
                       required>
            </div>
        </div>

        <!-- Parol -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
                Parol
            </label>
            <div class="relative">
          <span class="absolute left-3 top-3 text-slate-400">
            <i data-lucide="lock" class="w-5 h-5"></i>
          </span>
                <input type="password" name="password"
                       class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-900"
                       required>
            </div>
        </div>

        <!-- Tugma -->
        <button type="submit"
                class="w-full py-3 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-800 transition flex items-center justify-center gap-2">
            <i data-lucide="log-in" class="w-5 h-5"></i>
            Kirish
        </button>
    </form>

</div>

<script>
    lucide.createIcons();
</script>

</body>
</html>
