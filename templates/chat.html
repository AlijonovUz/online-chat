<!doctype html>
<html lang="uz">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>{{ receiver_name }}</title>

    <style>
        /* scroll hide */
        #messages::-webkit-scrollbar,
        #emojiGrid::-webkit-scrollbar,
        #emojiPicker::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        #messages, #emojiGrid, #emojiPicker {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* --- Telegram-ish bubbles --- */
        .msg-row {
            display: flex;
            width: 100%;
        }

        .msg-row.in {
            justify-content: flex-start;
        }

        .msg-row.out {
            justify-content: flex-end;
        }

        .bubble {
            position: relative;
            width: fit-content;
            max-width: 78%;
            padding: 10px 14px 22px 14px;
            border-radius: 22px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
        }

        .bubble.in {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            border-bottom-left-radius: 10px;
        }

        .bubble.out {
            background: #0f172a;
            color: #ffffff;
            border-bottom-right-radius: 10px;
        }

        .bubble-text {
            font-size: 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: normal;
            overflow-wrap: anywhere;
            padding-right: 56px;
        }

        .bubble-meta {
            position: absolute;
            right: 10px;
            bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            opacity: .75;
            user-select: none;
            line-height: 1;
            white-space: nowrap;
        }

        .ticks {
            font-size: 12px;
            opacity: .9;
        }

        .ticks[data-read="1"] {
            color: #60a5fa;
            opacity: 1;
        }
    </style>
</head>

<body class="bg-slate-100">
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden">

        <!-- Header -->
        <div class="px-5 py-4 border-b flex items-center justify-between bg-white">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center">
                    <i data-lucide="user" class="w-5 h-5 text-slate-700"></i>
                </div>

                <div>
                    <h1 class="text-base font-semibold text-slate-900">{{ receiver_name }}</h1>
                    <div id="subStatus" class="text-xs text-slate-500">{{ receiver_status }}</div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="{% url 'chat_list' %}"
                   class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700"
                   title="Asosiy sahifa">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </a>

                <button id="reconnectBtn"
                        class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-900 hover:bg-slate-800 text-white"
                        title="Qayta ulash">
                    <i data-lucide="refresh-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div id="messages" class="h-[68vh] overflow-y-auto px-5 py-5 space-y-3 bg-slate-50"></div>

        <!-- Composer -->
        <div class="p-4 border-t bg-white">
            <form id="form" class="flex items-end gap-3">

                <!-- Emoji -->
                <div class="relative">
                    <button type="button" id="emojiBtn" class="p-3 rounded-2xl bg-slate-100 hover:bg-slate-200"
                            title="Emoji">
                        <i data-lucide="smile" class="w-5 h-5 text-slate-700"></i>
                    </button>

                    <div id="emojiPicker"
                         class="hidden absolute bottom-14 left-0 w-80 bg-white border border-slate-200 rounded-2xl shadow-lg p-3">

                        <div class="flex items-center justify-between gap-2 mb-2">
                            <div class="text-xs text-slate-500">Emoji tanlang</div>
                            <button id="emojiCloseBtn" type="button" class="p-1 rounded-lg hover:bg-slate-100"
                                    title="Yopish">
                                <i data-lucide="x" class="w-4 h-4 text-slate-600"></i>
                            </button>
                        </div>

                        <input id="emojiSearch" type="text" autocomplete="off"
                               class="w-full mb-3 px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900 text-sm"
                               placeholder="Qidirish"/>

                        <div class="flex gap-2 mb-3">
                            <button type="button" data-tab="faces"
                                    class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-medium bg-slate-900 text-white">
                                🙂
                            </button>
                            <button type="button" data-tab="hearts"
                                    class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200">
                                ❤️
                            </button>
                            <button type="button" data-tab="others"
                                    class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200">
                                ✨
                            </button>
                        </div>

                        <div id="emojiGrid" class="grid grid-cols-8 gap-2 text-xl max-h-64 overflow-y-auto pr-1"></div>

                        <div id="emojiEmpty" class="hidden text-sm text-slate-500 mt-3 text-center">
                            Hech narsa topilmadi 😅
                        </div>
                    </div>
                </div>

                <div class="flex-1">
                    <input id="messageInput" autocomplete="off"
                           class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900"
                           placeholder="Xabar yozing..."/>
                </div>

                <button id="sendBtn"
                        class="p-3 rounded-2xl bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed"
                        title="Yuborish">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </form>
        </div>

    </div>
</div>

    const formEl = document.getElementById("form");

    const reconnectBtn = document.getElementById("reconnectBtn");

    const emojiPicker = document.getElementById("emojiPicker");
    const emojiGrid = document.getElementById("emojiGrid");
    const emojiCloseBtn = document.getElementById("emojiCloseBtn");
    const emojiSearch = document.getElementById("emojiSearch");
    const emojiEmpty = document.getElementById("emojiEmpty");
    const emojiTabs = Array.from(document.querySelectorAll(".emojiTab"));

    let socket = null;
    let typingTimer = null;
    let typingCooldown = false;
    let lastBaseStatus = subStatusEl.textContent || "yaqinda onlayn edi";

    function escapeHtml(s) {
        return (s || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function setSubStatus(text) {
        subStatusEl.textContent = text;
    }

    function addMessage({id, message, created_at, user_id, is_read}, isMe = false) {
        const row = document.createElement("div");
        row.className = "msg-row " + (isMe ? "out" : "in");

        const bubble = document.createElement("div");
        bubble.className = "bubble " + (isMe ? "out" : "in");
        if (id !== undefined && id !== null) bubble.dataset.id = String(id);

        const text = document.createElement("div");
        text.className = "bubble-text";
        text.textContent = message || "";

        const meta = document.createElement("div");
        meta.className = "bubble-meta";

        const timeEl = document.createElement("span");
        timeEl.textContent = created_at || "";
        meta.appendChild(timeEl);

        if (isMe) {
            const ticks = document.createElement("span");
            ticks.className = "ticks";
            const read = !!is_read;
            ticks.dataset.read = read ? "1" : "0";
            ticks.textContent = read ? "✓✓" : "✓";
            meta.appendChild(ticks);
        }

        bubble.appendChild(text);
        bubble.appendChild(meta);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setTicksReadUpTo(upToId) {
        const upTo = Number(upToId || 0);
        if (!upTo) return;

        document.querySelectorAll(".bubble.out").forEach(b => {
            const mid = Number(b.dataset.id || 0);
            if (mid && mid <= upTo) {
                const t = b.querySelector(".ticks");
                if (t) {
                    t.textContent = "✓✓";
                    t.dataset.read = "1";
                }
            }
        });
    }

    function connectWs() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

        const scheme = location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${scheme}://${location.host}/ws/private/${receiverId}/`;
        socket = new WebSocket(wsUrl);

        setSubStatus("Ulanmoqda...");
        sendBtn.disabled = true;

        socket.onopen = () => {
            sendBtn.disabled = false;
            setSubStatus(lastBaseStatus);
        };

        socket.onclose = () => {
            sendBtn.disabled = true;
            lastBaseStatus = "yaqinda onlayn edi";
            setSubStatus(lastBaseStatus);
        };

        socket.onerror = () => {
            sendBtn.disabled = true;
            setSubStatus("Xatolik");
        };

        socket.onmessage = (e) => {
            const data = JSON.parse(e.data);

            if (data.history) {
                messagesEl.innerHTML = "";
                (data.messages || []).forEach(m => {
                    const isMe = (Number(m.user_id) === ME_ID);
                    addMessage(m, isMe);
                });
                setSubStatus(lastBaseStatus);
                return;
            }

            if (data.presence) {
                if (Number(data.user_id) === receiverId) {
                    lastBaseStatus = data.status || lastBaseStatus;
                    setSubStatus(lastBaseStatus);
                }
                return;
            }

            if (data.typing) {
                if (Number(data.user_id) !== receiverId) return;
                setSubStatus("yozmoqda...");
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => setSubStatus(lastBaseStatus), 1000);
                return;
            }

            if (data.type === "chat_read") {
                if (Number(data.reader_id) !== receiverId) return;
                setTicksReadUpTo(data.up_to_id);
                return;
            }

            if (data.message) {
                const isMe = (Number(data.user_id) === ME_ID);
                addMessage(data, isMe);
            }
        };
    }

    reconnectBtn.onclick = () => {
        try {
            socket && socket.close();
        } catch {
        }
        connectWs();
    };

    inputEl.addEventListener("input", () => {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        if (typingCooldown) return;
        typingCooldown = true;
        socket.send(JSON.stringify({typing: true}));
        setTimeout(() => (typingCooldown = false), 800);
    });

    inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            formEl.requestSubmit();
        }
    });

    formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!socket || socket.readyState !== WebSocket.OPEN) return;

        const msg = (inputEl.value || "").trim();
        if (!msg) return;

        socket.send(JSON.stringify({message: msg}));
        inputEl.value = "";
        inputEl.focus();
    });

            {e: "⚾", k: ["baseball"]}, {e: "🎾", k: ["tennis"]}, {e: "🏐", k: ["volleyball"]}, {
                e: "🎮",
                k: ["game", "controller"]
            },
            {e: "🎧", k: ["headphones", "music"]}
        ]
    };

    let activeTab = "faces";

    function setActiveTab(tab) {
        activeTab = tab;
        emojiTabs.forEach(btn => {
            const isActive = btn.dataset.tab === tab;
            btn.className =
                "emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-medium " +
                (isActive ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700 hover:bg-slate-200");
        });
        renderEmojis();
    }

    function matchesSearch(item, q) {
        if (!q) return true;
        const query = q.toLowerCase().trim();
        if (!query) return true;
        return (item.k || []).some(x => String(x).toLowerCase().includes(query));
    }

    function renderEmojis() {
        const q = emojiSearch.value || "";
        emojiGrid.innerHTML = "";

        const items = (EMOJIS[activeTab] || []).filter(it => matchesSearch(it, q));
        if (items.length === 0) {
            emojiEmpty.classList.remove("hidden");
            return;
        }
        emojiEmpty.classList.add("hidden");

        items.forEach(it => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = it.e;
            btn.className = "w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 transition";
            btn.onclick = () => {
                inputEl.value += it.e;
                inputEl.focus();
            };
            emojiGrid.appendChild(btn);
        });
    }

    function openEmojiPicker() {
        emojiPicker.classList.remove("hidden");
        emojiSearch.value = "";
        setActiveTab(activeTab);
        setTimeout(() => emojiSearch.focus(), 0);
    }

    function closeEmojiPicker() {
        emojiPicker.classList.add("hidden");
    }

    emojiBtn.onclick = () => {
        emojiPicker.classList.contains("hidden") ? openEmojiPicker() : closeEmojiPicker();
    };

    emojiCloseBtn.onclick = closeEmojiPicker;
    emojiTabs.forEach(btn => btn.addEventListener("click", () => setActiveTab(btn.dataset.tab)));
    emojiSearch.addEventListener("input", renderEmojis);

    document.addEventListener("click", (e) => {
        if (!emojiBtn.contains(e.target) && !emojiPicker.contains(e.target)) closeEmojiPicker();
    });

    connectWs();
</script>
</body>
</html>
