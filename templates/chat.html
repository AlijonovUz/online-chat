<!doctype html>
<html lang="uz">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>{{ receiver_name }}</title>

    <style>
        #messages::-webkit-scrollbar,
        #emojiGrid::-webkit-scrollbar,
        #emojiPicker::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        #messages, #emojiGrid, #emojiPicker {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .msg-row {
            display: flex;
            width: 100%;
        }

        .msg-row.in {
            justify-content: flex-start;
        }

        .msg-row.out {
            justify-content: flex-end;
        }

        .msg-inner {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: 0 8px;
        }

        .bubble {
            position: relative;
            width: fit-content;
            max-width: min(78%, 62ch);
            padding: 10px 14px 22px 14px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .bubble.in {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            color: #0f172a;
            border-bottom-left-radius: 12px;
        }

        .bubble.out {
            background: linear-gradient(180deg, #0f172a, #0b1220);
            color: #ffffff;
            border-bottom-right-radius: 12px;
        }

        .bubble-text {
            font-size: 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            padding-right: 62px;
        }

        .bubble-meta {
            position: absolute;
            right: 10px;
            bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            opacity: 0.75;
            user-select: none;
            line-height: 1;
            white-space: nowrap;
        }

        .ticks {
            position: relative;
            width: 22px;
            height: 14px;
            display: inline-block;
            margin-left: 4px;
            opacity: 0.95;
            transform: translateY(0.5px);
            color: rgba(255, 255, 255, 0.85);
        }

        .ticks svg {
            position: absolute;
            top: 0;
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ticks .c1 {
            left: 0;
            opacity: 1;
        }

        .ticks .c2 {
            left: 6px;
            opacity: 0;
        }

        .ticks[data-read="0"] .c2 {
            opacity: 0;
        }

        .ticks[data-read="1"] .c2 {
            opacity: 1;
        }

        .bubble.out .ticks[data-read="1"] {
            color: #60a5fa;
        }

        .bubble.in .ticks {
            color: #64748b;
        }

        .emoji-btn {
            height: 44px;
            width: 44px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            transition: 0.15s;
        }

        .emoji-btn:hover {
            background: #f8fafc;
        }
    </style>
</head>

<body class="bg-white text-slate-900">
<div class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200">
        <div class="mx-auto max-w-5xl px-4 sm:px-6 py-3">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center shrink-0">
                        <i data-lucide="user" class="w-5 h-5 text-slate-700"></i>
                    </div>

                    <div class="min-w-0">
                        <h1 class="text-base sm:text-lg font-semibold text-slate-900 truncate">{{ receiver_name }}</h1>
                        <div id="subStatus" class="text-xs text-slate-500 truncate">{{ receiver_status }}</div>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <a href="{% url 'chat_list' %}"
                       class="w-10 h-10 flex items-center justify-center rounded-2xl border border-slate-200 hover:bg-slate-50 text-slate-700 transition">
                        <i data-lucide="home" class="w-5 h-5"></i>
                    </a>

                    <button id="reconnectBtn"
                            class="w-10 h-10 flex items-center justify-center rounded-2xl bg-slate-900 hover:bg-slate-800 text-white transition active:scale-[0.98]">
                        <i data-lucide="refresh-ccw" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 bg-slate-50">
        <div class="mx-auto max-w-5xl px-4 sm:px-6">
            <div class="msg-inner">
                <div id="messages"
                     class="h-[calc(100vh-160px)] sm:h-[calc(100vh-168px)] overflow-y-auto py-5 space-y-3">
                </div>
            </div>
        </div>
    </main>

    <footer class="sticky bottom-0 z-30 bg-white/90 backdrop-blur border-t border-slate-200">
        <div class="mx-auto max-w-5xl px-4 sm:px-6 py-3">
            <form id="form" class="flex items-end gap-2">

                <div class="relative">
                    <button type="button"
                            id="emojiBtn"
                            class="h-11 w-11 rounded-2xl border border-slate-200 bg-white
               hover:bg-slate-50 transition active:scale-[0.98]
               flex items-center justify-center">
                        <i data-lucide="smile"
                           class="w-5 h-5 text-slate-700 -translate-y-[1px]"
                           style="stroke-width:2.2"></i>
                    </button>


                    <div id="emojiPicker"
                         class="hidden absolute bottom-14 left-0 w-72 sm:w-80 bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">

                        <div class="px-3 py-2 border-b border-slate-200 flex items-center justify-between">
                            <div class="text-xs font-semibold text-slate-600">Emoji</div>
                            <button id="emojiCloseBtn" type="button"
                                    class="w-9 h-9 rounded-xl hover:bg-slate-50 flex items-center justify-center transition"
                                    title="Yopish">
                                <i data-lucide="x" class="w-4.5 h-4.5 text-slate-600"></i>
                            </button>
                        </div>

                        <div class="p-3">
                            <div class="flex gap-2">
                                <button type="button" data-tab="faces"
                                        class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-white">
                                    🙂
                                </button>
                                <button type="button" data-tab="hands"
                                        class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">
                                    ✋
                                </button>
                                <button type="button" data-tab="hearts"
                                        class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">
                                    ❤️
                                </button>
                            </div>
                        </div>

                        <div class="px-3 pb-3">
                            <div id="emojiGrid"
                                 class="grid grid-cols-8 gap-1.5 text-xl max-h-56 overflow-y-auto pr-1"></div>
                        </div>
                    </div>
                </div>

                <div class="flex-1">
                    <input id="messageInput" autocomplete="off"
                           class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200
                        focus:outline-none focus:ring-4 focus:ring-slate-900/10 focus:border-slate-300 transition"
                           placeholder="Xabar yozing..."/>
                </div>

                <button id="sendBtn"
                        class="h-11 w-11 rounded-2xl bg-slate-900 text-white hover:bg-slate-800
               transition active:scale-[0.98]
               flex items-center justify-center shadow-sm">
                    <i data-lucide="arrow-up"
                       class="w-5 h-5 -translate-y-[1px]"
                       style="stroke-width:2.4"></i>
                </button>
            </form>
        </div>
    </footer>

</div>

<script>
    lucide.createIcons();

    const ME_ID = Number("{{ me_id }}");
    const receiverId = Number("{{ receiver_id }}");

    const messagesEl = document.getElementById("messages");
    const subStatusEl = document.getElementById("subStatus");
    const inputEl = document.getElementById("messageInput");
    const formEl = document.getElementById("form");
    const sendBtn = document.getElementById("sendBtn");
    const reconnectBtn = document.getElementById("reconnectBtn");

    const emojiBtn = document.getElementById("emojiBtn");
    const emojiPicker = document.getElementById("emojiPicker");
    const emojiGrid = document.getElementById("emojiGrid");
    const emojiCloseBtn = document.getElementById("emojiCloseBtn");
    const emojiTabs = Array.from(document.querySelectorAll(".emojiTab"));

    let socket = null;
    let typingTimer = null;
    let typingCooldown = false;
    let lastBaseStatus = subStatusEl.textContent || "yaqinda onlayn edi";

    function setSubStatus(text) {
        subStatusEl.textContent = text;
    }

    function makeTicks(isRead) {
        const wrap = document.createElement("span");
        wrap.className = "ticks";
        wrap.dataset.read = isRead ? "1" : "0";

        wrap.innerHTML = `
    <svg class="c1" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 6L9 17l-5-5"></path>
    </svg>
    <svg class="c2" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 6L9 17l-5-5"></path>
    </svg>
  `;
        return wrap;
    }

    function addMessage({id, message, created_at, user_id, is_read}, isMe = false) {
        const row = document.createElement("div");
        row.className = "msg-row " + (isMe ? "out" : "in");

        const bubble = document.createElement("div");
        bubble.className = "bubble " + (isMe ? "out" : "in");
        if (id !== undefined && id !== null) bubble.dataset.id = String(id);

        const text = document.createElement("div");
        text.className = "bubble-text";
        text.textContent = message || "";

        const meta = document.createElement("div");
        meta.className = "bubble-meta";

        const timeEl = document.createElement("span");
        timeEl.textContent = created_at || "";
        meta.appendChild(timeEl);

        if (isMe) meta.appendChild(makeTicks(!!is_read));

        bubble.appendChild(text);
        bubble.appendChild(meta);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setTicksReadUpTo(upToId) {
        const upTo = Number(upToId || 0);
        if (!upTo) return;

        document.querySelectorAll(".bubble.out").forEach(b => {
            const mid = Number(b.dataset.id || 0);
            if (mid && mid <= upTo) {
                const t = b.querySelector(".ticks");
                if (t) t.dataset.read = "1";
            }
        });
    }

    function connectWs() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

        const scheme = location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${scheme}://${location.host}/ws/private/${receiverId}/`;
        socket = new WebSocket(wsUrl);

        setSubStatus("Ulanmoqda...");
        sendBtn.disabled = true;

        socket.onopen = () => {
            sendBtn.disabled = false;
            setSubStatus(lastBaseStatus);
        };
        socket.onclose = () => {
            sendBtn.disabled = true;
            lastBaseStatus = "yaqinda onlayn edi";
            setSubStatus(lastBaseStatus);
        };
        socket.onerror = () => {
            sendBtn.disabled = true;
            setSubStatus("Ulanmoqda...");
        };

        socket.onmessage = (e) => {
            const data = JSON.parse(e.data);

            if (data.history) {
                messagesEl.innerHTML = "";
                (data.messages || []).forEach(m => addMessage(m, Number(m.user_id) === ME_ID));
                setSubStatus(lastBaseStatus);
                return;
            }

            if (data.presence) {
                if (Number(data.user_id) === receiverId) {
                    lastBaseStatus = data.status || lastBaseStatus;
                    setSubStatus(lastBaseStatus);
                }
                return;
            }

            if (data.typing) {
                if (Number(data.user_id) !== receiverId) return;
                setSubStatus("yozmoqda...");
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => setSubStatus(lastBaseStatus), 1000);
                return;
            }

            if (data.type === "chat_read") {
                if (Number(data.reader_id) !== receiverId) return;
                setTicksReadUpTo(data.up_to_id);
                return;
            }

            if (data.message) addMessage(data, Number(data.user_id) === ME_ID);
        };
    }

    reconnectBtn.onclick = () => {
        try {
            socket && socket.close();
        } catch {
        }
        connectWs();
    };

    inputEl.addEventListener("input", () => {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        if (typingCooldown) return;
        typingCooldown = true;
        socket.send(JSON.stringify({typing: true}));
        setTimeout(() => (typingCooldown = false), 800);
    });

    inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            formEl.requestSubmit();
        }
    });

    formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!socket || socket.readyState !== WebSocket.OPEN) return;

        const msg = (inputEl.value || "").trim();
        if (!msg) return;

        socket.send(JSON.stringify({message: msg}));
        inputEl.value = "";
        inputEl.focus();
    });

    const EMOJIS = {
        faces: [
            "😀", "😁", "😂", "🤣", "😃", "😄", "😅", "😆", "😉", "😊", "🙂", "🙃", "😍", "😘", "😗", "😙", "😚", "😋", "😛", "😜", "🤪", "😝",
            "🤗", "🤭", "🤫", "🤔", "😐", "😑", "😶", "🙄", "😏", "😌", "😔", "😪", "🤤", "😴", "😷", "🤒", "🤕", "🤢", "🤮", "🤧",
            "🥵", "🥶", "😵", "🤯", "😎", "🤓", "🧐", "😕", "😟", "🙁", "☹️", "😮", "😯", "😲", "😳", "🥺", "😦", "😧", "😨",
            "😰", "😥", "😢", "😭", "😱", "😖", "😣", "😞", "😓", "😩", "😫", "😤", "😡", "😠", "🤬"
        ],
        hands: [
            "👋", "🤚", "✋", "🖐️", "🖖", "👌", "🤌", "🤏", "✌️", "🤞", "🤟", "🤘", "🤙", "👍", "👎", "👊", "✊", "🤛", "🤜",
            "👏", "🙌", "👐", "🤲", "🙏", "💪"
        ],
        hearts: [
            "❤️", "🧡", "💛", "💚", "💙", "💜", "🖤", "🤍", "🤎", "💔", "❣️", "💕", "💞", "💓", "💗", "💖", "💘", "💝", "💟",
            "❤️‍🔥", "❤️‍🩹", "💌", "💋", "🫶", "💍"
        ]
    };

    let activeTab = "faces";

    function setActiveTab(tab) {
        activeTab = tab;
        emojiTabs.forEach(btn => {
            const isActive = btn.dataset.tab === tab;
            btn.className =
                "emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-semibold " +
                (isActive ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700 hover:bg-slate-200");
        });
        renderEmojis();
    }

    function renderEmojis() {
        emojiGrid.innerHTML = "";
        (EMOJIS[activeTab] || []).forEach(e => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = e;
            btn.className = "w-9 h-9 flex items-center justify-center rounded-xl hover:bg-slate-100 transition";
            btn.onclick = () => {
                inputEl.value += e;
                inputEl.focus();
            };
            emojiGrid.appendChild(btn);
        });
    }

    function openEmojiPicker() {
        emojiPicker.classList.remove("hidden");
        setActiveTab(activeTab);
    }

    function closeEmojiPicker() {
        emojiPicker.classList.add("hidden");
    }

    emojiBtn.onclick = () => emojiPicker.classList.contains("hidden") ? openEmojiPicker() : closeEmojiPicker();
    emojiCloseBtn.onclick = closeEmojiPicker;
    emojiTabs.forEach(btn => btn.addEventListener("click", () => setActiveTab(btn.dataset.tab)));

    document.addEventListener("click", (e) => {
        if (!emojiBtn.contains(e.target) && !emojiPicker.contains(e.target)) closeEmojiPicker();
    });

    connectWs();
</script>
</body>
</html>
