<!doctype html>
<html lang="uz">
<head>
    {% load static %}
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <title>{{ receiver_name }}</title>

    <link href="{% static 'images/favicon.ico' %}" rel="icon">

    <style>
        html, body {
            height: 100%;
        }

        :root {
            --vh: 1vh;
        }

        .app-vh {
            height: calc(var(--vh) * 100);
        }

        #messages::-webkit-scrollbar,
        #emojiGrid::-webkit-scrollbar,
        #emojiPicker::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        #messages, #emojiGrid, #emojiPicker {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .msg-row {
            display: flex;
            width: 100%;
        }

        .msg-row.in {
            justify-content: flex-start;
        }

        .msg-row.out {
            justify-content: flex-end;
        }

        .msg-inner {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: 0 8px;
        }

        .bubble {
            position: relative;
            width: fit-content;
            max-width: min(78%, 62ch);
            padding: 10px 14px 22px 14px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .bubble.in {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            color: #0f172a;
            border-bottom-left-radius: 12px;
        }

        .bubble.out {
            background: linear-gradient(180deg, #0f172a, #0b1220);
            color: #ffffff;
            border-bottom-right-radius: 12px;
        }

        .bubble-text {
            font-size: 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            padding-right: 62px;
        }

        .bubble-meta {
            position: absolute;
            right: 10px;
            bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            opacity: 0.75;
            user-select: none;
            line-height: 1;
            white-space: nowrap;
        }

        .ticks {
            position: relative;
            width: 22px;
            height: 14px;
            display: inline-block;
            margin-left: 4px;
            opacity: 0.95;
            transform: translateY(0.5px);
            color: rgba(255, 255, 255, 0.85);
        }

        .ticks svg {
            position: absolute;
            top: 0;
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ticks .c1 {
            left: 0;
            opacity: 1;
        }

        .ticks .c2 {
            left: 6px;
            opacity: 0;
        }

        .ticks[data-read="0"] .c2 {
            opacity: 0;
        }

        .ticks[data-read="1"] .c2 {
            opacity: 1;
        }

        .bubble.out .ticks[data-read="1"] {
            color: #60a5fa;
        }

        .bubble.in .ticks {
            color: #64748b;
        }

        .emoji-btn {
            height: 44px;
            width: 44px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            transition: 0.15s;
        }

        .emoji-btn:hover {
            background: #f8fafc;
        }

        .ctx-menu {
            position: fixed;
            z-index: 9999;
            min-width: 190px;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(10px);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
            padding: 6px;
            display: none;
        }

        .ctx-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 14px;
            color: #0f172a;
            transition: .12s;
            user-select: none;
        }

        .ctx-item:hover {
            background: #f1f5f9;
        }

        .ctx-item.danger {
            color: #b91c1c;
        }

        .ctx-item.danger:hover {
            background: #fee2e2;
        }

        .ctx-sep {
            height: 1px;
            background: #e2e8f0;
            margin: 6px 6px;
        }

        .loader-dot {
            width: 4px;
            height: 4px;
            border-radius: 999px;
            background: #94a3b8;
            opacity: .35;
            animation: ld 1s infinite ease-in-out;
        }

        .loader-dot:nth-child(2) {
            animation-delay: .15s;
        }

        .loader-dot:nth-child(3) {
            animation-delay: .30s;
        }

        .loading-older [data-sep="1"] {
            visibility: hidden;
        }

        @keyframes ld {
            0%, 100% {
                transform: translateY(0);
                opacity: .35;
            }
            50% {
                transform: translateY(-3px);
                opacity: .9;
            }
        }
    </style>
</head>

<body class="bg-white text-slate-900 select-none">
<div class="app-vh flex flex-col">

    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200">
        <div class="mx-auto max-w-5xl px-4 sm:px-6 py-3">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center shrink-0">
                        <i data-lucide="user" class="w-5 h-5 text-slate-700"></i>
                    </div>

                    <div class="min-w-0">
                        <div class="flex items-center gap-1">
                            <h1 class="text-base sm:text-lg font-semibold text-slate-900 truncate">
                                {{ receiver_name }}
                            </h1>

                            {% if receiver_is_verified %}
                            <svg class="w-[16px] h-[16px] shrink-0 block"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 aria-hidden="true">
                                <circle cx="12" cy="12" r="10" fill="#3390EC"/>
                                <path d="M8 12.5L10.2 14.7L16 9"
                                      stroke="white"
                                      stroke-width="2"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"/>
                            </svg>
                            {% endif %}
                        </div>

                        <div id="subStatus" class="text-xs text-slate-500 truncate">
                            {{ receiver_status }}
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <a href="{% url 'chat_list' %}"
                       class="w-10 h-10 flex items-center justify-center rounded-2xl border border-slate-200 hover:bg-slate-50 text-slate-700 transition">
                        <i data-lucide="home" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 bg-slate-50 overflow-hidden">
        <div class="mx-auto max-w-5xl px-4 sm:px-6 h-full">
            <div class="msg-inner h-full">
                <div id="messages" class="relative h-full overflow-y-auto py-5 space-y-3">
                    <div id="olderLoader"
                         class="hidden absolute top-3 left-0 right-0 z-10 flex justify-center pointer-events-none">
                        <div class="px-3 py-1 rounded-full text-[12px] font-semibold
                bg-white/90 border border-slate-200 text-slate-500 shadow-sm
                backdrop-blur inline-flex items-center gap-2">
                          <span class="inline-flex gap-1">
                            <span class="loader-dot"></span>
                            <span class="loader-dot"></span>
                            <span class="loader-dot"></span>
                          </span>
                            Yuklanmoqda...
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <button id="scrollBottomBtn"
                class="hidden fixed bottom-24 right-6 z-40
               w-11 h-11 rounded-2xl bg-slate-900 text-white
               flex items-center justify-center
               shadow-lg hover:bg-slate-800 transition active:scale-[0.95]">
            <i data-lucide="arrow-down" class="w-5 h-5"></i>
        </button>
    </main>

    <footer class="sticky bottom-0 z-30 bg-white/90 backdrop-blur border-t border-slate-200">
        <div class="mx-auto max-w-5xl px-4 sm:px-6 py-3">
            <form id="form" class="flex items-center gap-2">

                <div class="relative">
                    <button type="button"
                            id="emojiBtn"
                            class="h-11 w-11 rounded-2xl border border-slate-200 bg-white
                                   hover:bg-slate-50 transition active:scale-[0.98]
                                   flex items-center justify-center">
                        <i data-lucide="smile"
                           class="w-5 h-5 text-slate-700 -translate-y-[1px]"
                           style="stroke-width:2.2"></i>
                    </button>

                    <div id="emojiPicker"
                         class="hidden absolute bottom-14 left-0 w-72 sm:w-80 bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">

                        <div class="px-3 py-2 border-b border-slate-200 flex items-center justify-between">
                            <div class="text-xs font-semibold text-slate-600">Emoji</div>
                            <button id="emojiCloseBtn" type="button"
                                    class="w-9 h-9 rounded-xl hover:bg-slate-50 flex items-center justify-center transition"
                                    title="Yopish">
                                <i data-lucide="x" class="w-[18px] h-[18px] text-slate-600"></i>
                            </button>
                        </div>

                        <div class="p-3">
                            <div class="flex gap-2">
                                <button type="button" data-tab="faces"
                                        class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-white">
                                    🙂
                                </button>
                                <button type="button" data-tab="hands"
                                        class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">
                                    ✋
                                </button>
                                <button type="button" data-tab="hearts"
                                        class="emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">
                                    ❤️
                                </button>
                            </div>
                        </div>

                        <div class="px-3 pb-3">
                            <div id="emojiGrid"
                                 class="grid grid-cols-8 gap-1.5 text-xl max-h-56 overflow-y-auto pr-1"></div>
                        </div>
                    </div>
                </div>

                <div class="flex-1">
                    <textarea id="messageInput" rows="1" autocomplete="off"
                              class="w-full min-h-[44px] px-4 py-3 rounded-2xl bg-white border border-slate-200
                                     focus:outline-none focus:ring-4 focus:ring-slate-900/10 focus:border-slate-300 transition
                                     resize-none overflow-hidden leading-5"
                              placeholder="Xabar yozing..."></textarea>
                </div>

                <button id="sendBtn"
                        class="h-11 w-11 rounded-2xl bg-slate-900 text-white hover:bg-slate-800
                               transition active:scale-[0.98]
                               flex items-center justify-center shadow-sm">
                    <i data-lucide="arrow-up"
                       class="w-5 h-5 -translate-y-[1px]"
                       style="stroke-width:2.4"></i>
                </button>
            </form>
        </div>
    </footer>

</div>
<script>
    lucide.createIcons();

    const ME_ID = Number("{{ me_id }}");
    const receiverId = Number("{{ receiver_id }}");

    const messagesEl = document.getElementById("messages");
    const subStatusEl = document.getElementById("subStatus");
    const inputEl = document.getElementById("messageInput");
    const formEl = document.getElementById("form");
    const sendBtn = document.getElementById("sendBtn");
    const scrollBtn = document.getElementById("scrollBottomBtn");
    const olderLoader = document.getElementById("olderLoader");

    const emojiBtn = document.getElementById("emojiBtn");
    const emojiPicker = document.getElementById("emojiPicker");
    const emojiGrid = document.getElementById("emojiGrid");
    const emojiCloseBtn = document.getElementById("emojiCloseBtn");
    const emojiTabs = Array.from(document.querySelectorAll(".emojiTab"));

    let socket = null;
    let typingTimer = null;
    let editingMessageId = null;
    let typingCooldown = false;
    let lastBaseStatus = subStatusEl.textContent || "yaqinda onlayn edi";


    let loadingOlder = false;
    let hasMoreOlder = true;

    let loaderHideTimer = null;
    let loaderShowTimer = null;
    let loaderShownAt = 0;

    const LOADER_DELAY_MS = 120;
    const LOADER_MIN_MS = 250;

    function showOlderLoader() {
        loaderShownAt = 0;

        if (loaderShowTimer) {
            clearTimeout(loaderShowTimer);
            loaderShowTimer = null;
        }

        loaderShowTimer = setTimeout(() => {
            loaderShownAt = Date.now();
            olderLoader.classList.remove("hidden");
        }, LOADER_DELAY_MS);
    }

    function hideOlderLoader() {
        loadingOlder = false;

        if (loaderShowTimer) {
            clearTimeout(loaderShowTimer);
            loaderShowTimer = null;
        }

        if (loaderHideTimer) {
            clearTimeout(loaderHideTimer);
            loaderHideTimer = null;
        }

        if (!loaderShownAt) {
            olderLoader.classList.add("hidden");
            syncSepVisibility();
            return;
        }

        const elapsed = Date.now() - loaderShownAt;
        const wait = Math.max(0, LOADER_MIN_MS - elapsed);

        loaderHideTimer = setTimeout(() => {
            olderLoader.classList.add("hidden");
            loaderShownAt = 0;
            loaderHideTimer = null;
            syncSepVisibility();
        }, wait);
    }

    function getTopAnchor() {
        const bubbles = Array.from(messagesEl.querySelectorAll(".bubble[data-id]"));
        if (!bubbles.length) return null;

        const boxTop = messagesEl.getBoundingClientRect().top;

        let best = bubbles[0];
        let bestDist = Infinity;

        for (const b of bubbles) {
            const dist = Math.abs(b.getBoundingClientRect().top - boxTop);
            if (dist < bestDist) {
                bestDist = dist;
                best = b;
            }
        }

        return {id: best.dataset.id, top: best.getBoundingClientRect().top};
    }

    function restoreTopAnchor(anchor) {
        if (!anchor) return;
        const bubble = messagesEl.querySelector(`.bubble[data-id="${anchor.id}"]`);
        if (!bubble) return;

        const newTop = bubble.getBoundingClientRect().top;
        const diff = newTop - anchor.top;
        messagesEl.scrollTop += diff;
    }

    function getOldestMessageId() {
        const bubbles = messagesEl.querySelectorAll(".bubble[data-id]");
        let min = null;
        bubbles.forEach(b => {
            const id = Number(b.dataset.id || 0);
            if (!id) return;
            if (min === null || id < min) min = id;
        });
        return min || 0;
    }

    function buildDateSepNode(label, key) {
        const wrap = document.createElement("div");
        wrap.dataset.sep = "1";
        wrap.dataset.dateKey = key;
        wrap.className = "flex justify-center py-2";
        wrap.innerHTML = `
          <div class="px-3 py-1 rounded-full text-[12px] font-semibold
                      bg-white/80 border border-slate-200 text-slate-500 shadow-sm">
            ${label}
          </div>`;
        return wrap;
    }

    function buildMessageNode(m) {
        const isMe = Number(m.user_id) === ME_ID;

        const row = document.createElement("div");
        row.className = "msg-row " + (isMe ? "out" : "in");

        const bubble = document.createElement("div");
        bubble.className = "bubble " + (isMe ? "out" : "in");
        if (m.id !== undefined && m.id !== null) bubble.dataset.id = String(m.id);

        const k = dateKeyFromIso(m.created_at);
        if (k) bubble.dataset.dateKey = k;

        const text = document.createElement("div");
        text.className = "bubble-text";
        text.textContent = m.message || "";

        const meta = document.createElement("div");
        meta.className = "bubble-meta";

        if (m.is_edited) {
            const ed = document.createElement("span");
            ed.className = "edited-label";
            ed.textContent = "✎";
            ed.style.opacity = "0.75";
            meta.appendChild(ed);
        }

        const timeEl = document.createElement("span");
        timeEl.textContent = formatTime(m.created_at);
        meta.appendChild(timeEl);

        if (isMe) meta.appendChild(makeTicks(!!m.is_read));

        bubble.appendChild(text);
        bubble.appendChild(meta);
        row.appendChild(bubble);
        return row;
    }

    function normalizeSeparators() {
        const bubbles = Array.from(messagesEl.querySelectorAll(".bubble[data-id]"));
        if (!bubbles.length) return;

        const order = [];
        const firstRowByKey = new Map();

        for (const b of bubbles) {
            const k = b.dataset.dateKey;
            if (!k) continue;
            if (!firstRowByKey.has(k)) {
                firstRowByKey.set(k, b.closest(".msg-row"));
                order.push(k);
            }
        }

        const seen = new Set();
        messagesEl.querySelectorAll('[data-sep="1"][data-date-key]').forEach(sep => {
            const k = sep.dataset.dateKey;
            if (!firstRowByKey.has(k) || seen.has(k)) {
                sep.remove();
            } else {
                seen.add(k);
            }
        });

        for (const k of order) {
            const row = firstRowByKey.get(k);
            if (!row) continue;
            insertDateSeparator(k, row);
        }
    }

    function prependBatch(msgs) {
        if (!msgs || !msgs.length) return;

        const anchor = getTopAnchor();

        const frag = document.createDocumentFragment();

        msgs.forEach(m => {
            if (m.id && messagesEl.querySelector(`.bubble[data-id="${m.id}"]`)) return;
            frag.appendChild(buildMessageNode(m));
        });

        messagesEl.insertBefore(frag, olderLoader.nextSibling);

        normalizeSeparators();
        restoreTopAnchor(anchor);
    }

    function isNearBottom() {
        return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
    }

    function updateScrollButton() {
        if (isNearBottom()) {
            scrollBtn.classList.add("hidden");
        } else {
            scrollBtn.classList.remove("hidden");
        }
    }

    const HIDE_SEP_AT = 220;
    const LOAD_TRIGGER = 120;

    function syncSepVisibility() {
        if (loadingOlder) messagesEl.classList.add("loading-older");
        else messagesEl.classList.remove("loading-older");
    }

    messagesEl.addEventListener("scroll", () => {
        updateScrollButton?.();
        syncSepVisibility();

        if (!hasMoreOlder) return;
        if (loadingOlder) return;
        if (!socket || socket.readyState !== WebSocket.OPEN) return;

        if (messagesEl.scrollTop <= LOAD_TRIGGER) {
            loadingOlder = true;
            syncSepVisibility();
            showOlderLoader();

            socket.send(JSON.stringify({
                type: "load_older",
                before_id: getOldestMessageId(),
                limit: 50
            }));
        }
    });

    function scrollToBottomSmooth() {
        messagesEl.scrollTo({top: messagesEl.scrollHeight, behavior: "smooth"});

        requestAnimationFrame(() => {
            messagesEl.scrollTo({top: messagesEl.scrollHeight, behavior: "smooth"});
        });

        setTimeout(() => {
            messagesEl.scrollTo({top: messagesEl.scrollHeight, behavior: "smooth"});
        }, 80);

        scrollBtn.classList.add("hidden");
    }

    scrollBtn.addEventListener("click", () => {
        messagesEl.scrollTo({
            top: messagesEl.scrollHeight,
            behavior: "smooth"
        });
    });

    function setSubStatus(text) {
        subStatusEl.textContent = text;
    }

    function autoGrowTextarea() {
        inputEl.style.height = "0px";
        inputEl.style.height = inputEl.scrollHeight + "px";
    }

    function focusInput() {
        setTimeout(() => {
            inputEl.focus();
            const v = inputEl.value || "";
            inputEl.setSelectionRange(v.length, v.length);
            autoGrowTextarea();
        }, 0);
    }

    function makeTicks(isRead) {
        const wrap = document.createElement("span");
        wrap.className = "ticks";
        wrap.dataset.read = isRead ? "1" : "0";

        wrap.innerHTML = `
    <svg class="c1" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 6L9 17l-5-5"></path>
    </svg>
    <svg class="c2" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 6L9 17l-5-5"></path>
    </svg>
  `;
        return wrap;
    }

    function renderEmptyState() {
        messagesEl.innerHTML = "";
        messagesEl.appendChild(olderLoader);
        olderLoader.classList.add("hidden");

        messagesEl.insertAdjacentHTML("beforeend", `
        <div data-empty class="h-full flex items-center justify-center px-4">
            <div class="text-center max-w-xs w-full">

                <div class="mx-auto w-16 h-16 rounded-2xl
                            bg-slate-100 border border-slate-200
                            flex items-center justify-center mb-5 shadow-sm">
                    <i data-lucide="message-circle" class="w-7 h-7 text-slate-500"></i>
                </div>

                <div class="text-base font-semibold text-slate-700">
                    Hali xabar yo'q
                </div>

                <div class="text-sm text-slate-500 mt-1">
                    Suhbatni boshlang va birinchi xabarni yuboring
                </div>

            </div>
        </div>
    `);

        lucide.createIcons();
    }

    function dateKeyFromIso(iso) {
        if (!iso) return null;

        const d = new Date(iso);
        if (!isNaN(d.getTime())) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
        }

        const s = String(iso);
        return s.length >= 10 ? s.slice(0, 10) : null;
    }

    function formatUzDayMonth(key) {
        const [y, m, d] = key.split("-").map(Number);

        const months = [
            "yanvar", "fevral", "mart", "aprel", "may", "iyun",
            "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"
        ];

        const month = months[(m - 1)] || "";
        return `${d} - ${month}`;
    }

    function formatTime(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        return d.toLocaleTimeString("uz-UZ", {
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function insertDateSeparator(key, beforeEl = null) {
        if (!key) return null;

        const exists = messagesEl.querySelector(`[data-sep="1"][data-date-key="${key}"]`);
        if (exists) {
            if (beforeEl && (beforeEl.compareDocumentPosition(exists) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                messagesEl.insertBefore(exists, beforeEl);
            }
            return exists;
        }

        const label = formatUzDayMonth(key);
        const wrap = document.createElement("div");
        wrap.dataset.sep = "1";
        wrap.dataset.dateKey = key;
        wrap.className = "flex justify-center py-2";
        wrap.innerHTML = `
    <div class="px-3 py-1 rounded-full text-[12px] font-semibold
                bg-white/80 border border-slate-200 text-slate-500 shadow-sm">
      ${label}
    </div>`;

        if (beforeEl) messagesEl.insertBefore(wrap, beforeEl);
        else messagesEl.appendChild(wrap);

        return wrap;
    }

    function addMessage({id, message, created_at, user_id, is_read, is_edited}, isMe = false) {
        const empty = messagesEl.querySelector("[data-empty]");
        if (empty) empty.remove();

        const key = dateKeyFromIso(created_at);

        const row = document.createElement("div");
        row.className = "msg-row " + (isMe ? "out" : "in");

        const bubble = document.createElement("div");
        bubble.className = "bubble " + (isMe ? "out" : "in");
        if (id !== undefined && id !== null) bubble.dataset.id = String(id);
        if (key) bubble.dataset.dateKey = key;

        const text = document.createElement("div");
        text.className = "bubble-text";
        text.textContent = message || "";

        const meta = document.createElement("div");
        meta.className = "bubble-meta";

        if (is_edited) {
            const ed = document.createElement("span");
            ed.className = "edited-label";
            ed.textContent = "✎";
            ed.style.opacity = "0.75";
            meta.appendChild(ed);
        }

        const timeEl = document.createElement("span");
        timeEl.textContent = formatTime(created_at);
        meta.appendChild(timeEl);

        if (isMe) meta.appendChild(makeTicks(!!is_read));

        bubble.appendChild(text);
        bubble.appendChild(meta);
        row.appendChild(bubble);

        messagesEl.appendChild(row);

        if (key) insertDateSeparator(key, row);

        updateScrollButton();
    }

    function setTicksReadUpTo(upToId) {
        const upTo = Number(upToId || 0);
        if (!upTo) return;

        document.querySelectorAll(".bubble.out").forEach(b => {
            const mid = Number(b.dataset.id || 0);
            if (mid && mid <= upTo) {
                const t = b.querySelector(".ticks");
                if (t) t.dataset.read = "1";
            }
        });
    }

    function connectWs() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

        const scheme = location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${scheme}://${location.host}/ws/private/${receiverId}/`;
        socket = new WebSocket(wsUrl);

        setSubStatus("Ulanmoqda...");
        sendBtn.disabled = true;

        socket.onopen = () => {
            sendBtn.disabled = false;
            setSubStatus(lastBaseStatus);
            focusInput();
        };
        socket.onclose = () => {
            sendBtn.disabled = true;
            lastBaseStatus = "yaqinda onlayn edi";
            loadingOlder = false;

            hideOlderLoader();
            setSubStatus(lastBaseStatus);
        };
        socket.onerror = () => {
            sendBtn.disabled = true;
            loadingOlder = false;

            hideOlderLoader();
            setSubStatus("Ulanmoqda...");
        };

        socket.onmessage = (e) => {
            const data = JSON.parse(e.data);

            if (data.history) {
                messagesEl.innerHTML = "";
                messagesEl.appendChild(olderLoader);
                olderLoader.classList.add("hidden");

                if (!data.messages || !data.messages.length) {
                    renderEmptyState();
                    return;
                }

                const msgs = (data.messages || []).slice().sort((a, b) => {
                    const ta = Date.parse(a.created_at || "") || 0;
                    const tb = Date.parse(b.created_at || "") || 0;
                    if (ta !== tb) return ta - tb;
                    return (Number(a.id) || 0) - (Number(b.id) || 0);
                });

                const frag = document.createDocumentFragment();
                let lastKey = null;

                msgs.forEach(m => {
                    const key = dateKeyFromIso(m.created_at);
                    if (key && key !== lastKey) {
                        frag.appendChild(buildDateSepNode(formatUzDayMonth(key), key));
                        lastKey = key;
                    }
                    frag.appendChild(buildMessageNode(m));
                });

                messagesEl.appendChild(frag);
                normalizeSeparators();
                messagesEl.scrollTop = messagesEl.scrollHeight;

                setSubStatus(lastBaseStatus);
                updateScrollButton();
                return;
            }

            if (data.presence) {
                if (Number(data.user_id) === receiverId) {
                    lastBaseStatus = data.status || lastBaseStatus;
                    setSubStatus(lastBaseStatus);
                }
                return;
            }

            if (data.typing) {
                if (Number(data.user_id) !== receiverId) return;
                setSubStatus("yozmoqda...");
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => setSubStatus(lastBaseStatus), 1000);
                return;
            }

            if (data.type === "chat_read") {
                if (Number(data.reader_id) !== receiverId) return;
                setTicksReadUpTo(data.up_to_id);
                return;
            }

            if (data.type === "chat_edited") {
                const mid = Number(data.message_id || 0);
                if (!mid) return;

                const bubble = document.querySelector(`.bubble[data-id="${mid}"]`);
                if (!bubble) return;

                const textEl = bubble.querySelector(".bubble-text");
                if (textEl) textEl.textContent = data.message || "";

                const meta = bubble.querySelector(".bubble-meta");
                if (meta) {
                    let ed = meta.querySelector(".edited-label");

                    if (!ed) {
                        ed = document.createElement("span");
                        ed.className = "edited-label";
                        ed.style.opacity = "0.75";
                    }

                    ed.textContent = "✎";

                    const timeEl = meta.querySelector("span");
                    if (timeEl) {
                        meta.insertBefore(ed, timeEl);
                    } else {
                        meta.prepend(ed);
                    }
                }

                return;
            }

            if (data.type === "chat_deleted") {
                const mid = Number(data.message_id || 0);
                if (!mid) return;

                const bubble = document.querySelector(`.bubble[data-id="${mid}"]`);
                const row = bubble ? bubble.closest(".msg-row") : null;
                if (row) row.remove();

                return;
            }

            if (data.type === "older_messages") {
                const msgs = (data.messages || []).slice().sort((a, b) => {
                    const ta = Date.parse(a.created_at || "") || 0;
                    const tb = Date.parse(b.created_at || "") || 0;
                    if (ta !== tb) return ta - tb;
                    return (Number(a.id) || 0) - (Number(b.id) || 0);
                });

                if (!msgs.length) {
                    hasMoreOlder = false;
                } else {
                    prependBatch(msgs);
                }

                loadingOlder = false;
                hideOlderLoader();
                return;
            }

            if (data.message) {
                const isMe = Number(data.user_id) === ME_ID;

                const shouldScroll = isMe || isNearBottom();

                addMessage(data, isMe);

                if (shouldScroll) scrollToBottomSmooth();

                return;
            }
        };
    }

    inputEl.addEventListener("input", () => {
        autoGrowTextarea();
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        if (typingCooldown) return;
        typingCooldown = true;
        socket.send(JSON.stringify({typing: true}));
        setTimeout(() => (typingCooldown = false), 800);
    });

    inputEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;

        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isMobile) {
            return;
        }

        if (!e.shiftKey) {
            e.preventDefault();
            formEl.requestSubmit();
        }
    });

    formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!socket || socket.readyState !== WebSocket.OPEN) return;

        const msg = (inputEl.value || "").trim();
        if (!msg) return;

        if (editingMessageId) {
            socket.send(JSON.stringify({
                edit: true,
                message_id: editingMessageId,
                message: msg
            }));
            editingMessageId = null;
            inputEl.classList.remove("ring-2", "ring-blue-500");
        } else {
            socket.send(JSON.stringify({message: msg}));
        }

        inputEl.value = "";
        autoGrowTextarea();
        inputEl.focus();
    });

    const EMOJIS = {
        faces: [
            "😀", "😁", "😂", "🤣", "😃", "😄", "😅", "😆", "😉", "😊", "🙂", "🙃", "😍", "😘", "😗", "😙", "😚", "😋", "😛", "😜", "🤪", "😝",
            "🤗", "🤭", "🤫", "🤔", "😐", "😑", "😶", "🙄", "😏", "😌", "😔", "😪", "🤤", "😴", "😷", "🤒", "🤕", "🤢", "🤮", "🤧",
            "🥵", "🥶", "😵", "🤯", "😎", "🤓", "🧐", "😕", "😟", "🙁", "☹️", "😮", "😯", "😲", "😳", "🥺", "😦", "😧", "😨",
            "😰", "😥", "😢", "😭", "😱", "😖", "😣", "😞", "😓", "😩", "😫", "😤", "😡", "😠", "🤬"
        ],
        hands: [
            "👋", "🤚", "✋", "🖐️", "🖖", "👌", "🤌", "🤏", "✌️", "🤞", "🤟", "🤘", "🤙", "👍", "👎", "👊", "✊", "🤛", "🤜",
            "👏", "🙌", "👐", "🤲", "🙏", "💪"
        ],
        hearts: [
            "❤️", "🧡", "💛", "💚", "💙", "💜", "🖤", "🤍", "🤎", "💔", "❣️", "💕", "💞", "💓", "💗", "💖", "💘", "💝", "💟",
            "❤️‍🔥", "❤️‍🩹", "💌", "💋", "🫶", "💍"
        ]
    };

    let activeTab = "faces";

    function setActiveTab(tab) {
        activeTab = tab;
        emojiTabs.forEach(btn => {
            const isActive = btn.dataset.tab === tab;
            btn.className =
                "emojiTab flex-1 px-3 py-2 rounded-xl text-sm font-semibold " +
                (isActive ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700 hover:bg-slate-200");
        });
        renderEmojis();
    }

    function renderEmojis() {
        emojiGrid.innerHTML = "";
        (EMOJIS[activeTab] || []).forEach(e => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = e;
            btn.className = "w-9 h-9 flex items-center justify-center rounded-xl hover:bg-slate-100 transition";
            btn.onclick = () => {
                inputEl.value += e;
                inputEl.focus();
            };
            emojiGrid.appendChild(btn);
        });
    }

    function openEmojiPicker() {
        emojiPicker.classList.remove("hidden");
        setActiveTab(activeTab);
    }

    function closeEmojiPicker() {
        emojiPicker.classList.add("hidden");
    }

    emojiBtn.onclick = () => emojiPicker.classList.contains("hidden") ? openEmojiPicker() : closeEmojiPicker();
    emojiCloseBtn.onclick = closeEmojiPicker;
    emojiTabs.forEach(btn => btn.addEventListener("click", () => setActiveTab(btn.dataset.tab)));

    document.addEventListener("click", (e) => {
        if (!emojiBtn.contains(e.target) && !emojiPicker.contains(e.target)) closeEmojiPicker();
    });

    const ctxMenu = document.createElement("div");
    ctxMenu.className = "ctx-menu";
    ctxMenu.innerHTML = `
    <button type="button" class="ctx-item" data-action="copy">
      <i data-lucide="copy" class="w-4 h-4"></i>
      <span>Nusxalash</span>
    </button>
    <div class="ctx-sep"></div>
    <button type="button" class="ctx-item" data-action="edit">
      <i data-lucide="edit-3" class="w-4 h-4"></i>
      <span>Tahrirlash</span>
    </button>
    <div class="ctx-sep"></div>
    <button type="button" class="ctx-item danger" data-action="delete">
      <i data-lucide="trash-2" class="w-4 h-4"></i>
      <span>O'chirish</span>
    </button>
  `;
    document.body.appendChild(ctxMenu);
    lucide.createIcons();

    let ctxTargetBubble = null;

    function hideCtxMenu() {
        ctxMenu.style.display = "none";
        ctxTargetBubble = null;
    }

    function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
    }

    function showCtxMenu(x, y, bubble) {
        ctxTargetBubble = bubble;

        const msgId = bubble?.dataset?.id ? Number(bubble.dataset.id) : 0;
        const isMine = bubble?.classList?.contains("out");
        const mine = (isMine && msgId);

        const delBtn = ctxMenu.querySelector('[data-action="delete"]');
        const editBtn = ctxMenu.querySelector('[data-action="edit"]');

        delBtn.style.display = mine ? "flex" : "none";
        editBtn.style.display = mine ? "flex" : "none";

        const seps = ctxMenu.querySelectorAll(".ctx-sep");

        if (seps[0]) seps[0].style.display = mine ? "block" : "none";
        if (seps[1]) seps[1].style.display = mine ? "block" : "none";

        ctxMenu.style.display = "block";

        const rect = ctxMenu.getBoundingClientRect();
        const px = clamp(x, 8, window.innerWidth - rect.width - 8);
        const py = clamp(y, 8, window.innerHeight - rect.height - 8);

        ctxMenu.style.left = px + "px";
        ctxMenu.style.top = py + "px";
    }

    async function copyText(text) {
        const t = (text || "").trim();
        if (!t) return;
        try {
            await navigator.clipboard.writeText(t);
        } catch {
            const ta = document.createElement("textarea");
            ta.value = t;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand("copy");
            } catch {
            }
            ta.remove();
        }
    }

    function requestDelete(messageId) {
        if (!messageId) return;
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify({delete: true, message_id: Number(messageId)}));
    }

    ctxMenu.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn || !ctxTargetBubble) return;

        const action = btn.dataset.action;
        const text = ctxTargetBubble.querySelector(".bubble-text")?.textContent || "";
        const messageId = Number(ctxTargetBubble.dataset.id || 0);

        if (action === "copy") {
            await copyText(text);
            hideCtxMenu();
            return;
        }

        if (action === "edit") {
            const messageId = Number(ctxTargetBubble.dataset.id || 0);
            const isMine = ctxTargetBubble.classList.contains("out");
            if (!isMine || !messageId) return;

            const text = ctxTargetBubble.querySelector(".bubble-text")?.textContent || "";
            editingMessageId = messageId;

            inputEl.value = text;
            autoGrowTextarea();
            inputEl.focus();
            inputEl.classList.add("ring-2", "ring-blue-500");

            hideCtxMenu();
            return;
        }

        if (action === "delete") {
            requestDelete(messageId);
            hideCtxMenu();
            return;
        }
    });

    document.addEventListener("click", (e) => {
        if (!ctxMenu.contains(e.target)) hideCtxMenu();
    });

    window.addEventListener("resize", hideCtxMenu);
    window.addEventListener("scroll", hideCtxMenu, true);

    function findBubbleFromEventTarget(t) {
        const bubble = t.closest?.(".bubble");
        if (!bubble) return null;
        if (!bubble.dataset.id) return null;
        return bubble;
    }

    messagesEl.addEventListener("contextmenu", (e) => {
        const bubble = findBubbleFromEventTarget(e.target);
        if (!bubble) return;
        e.preventDefault();
        showCtxMenu(e.clientX, e.clientY, bubble);
    });

    let lpTimer = null;
    let lpStart = null;
    const LONG_PRESS_MS = 420;
    const MOVE_CANCEL_PX = 12;

    messagesEl.addEventListener("touchstart", (e) => {
        const bubble = findBubbleFromEventTarget(e.target);
        if (!bubble) return;

        if (lpTimer) clearTimeout(lpTimer);
        const t = e.touches[0];
        lpStart = {x: t.clientX, y: t.clientY, bubble};

        lpTimer = setTimeout(() => {
            showCtxMenu(lpStart.x, lpStart.y, lpStart.bubble);
        }, LONG_PRESS_MS);
    }, {passive: true});

    messagesEl.addEventListener("touchmove", (e) => {
        if (!lpStart || !lpTimer) return;
        const t = e.touches[0];
        const dx = t.clientX - lpStart.x;
        const dy = t.clientY - lpStart.y;
        if (Math.hypot(dx, dy) > MOVE_CANCEL_PX) {
            clearTimeout(lpTimer);
            lpTimer = null;
        }
    }, {passive: true});

    messagesEl.addEventListener("touchend", () => {
        if (lpTimer) clearTimeout(lpTimer);
        lpTimer = null;
        lpStart = null;
    }, {passive: true});

    function setRealVh() {
        const vv = window.visualViewport;
        const h = vv ? vv.height : window.innerHeight;
        document.documentElement.style.setProperty("--vh", (h * 0.01) + "px");
    }

    setRealVh();
    window.addEventListener("resize", setRealVh);
    window.addEventListener("orientationchange", setRealVh);

    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", setRealVh);
        window.visualViewport.addEventListener("scroll", setRealVh);
    }

    connectWs();
    syncSepVisibility();
    updateScrollButton();
</script>
<script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('keydown', (e) => {
        const key = e.key?.toLowerCase();

        if (e.key === 'F12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        if (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        if (e.ctrlKey && key === 'u') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        if (e.metaKey && e.altKey && (key === 'i' || key === 'j')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);
</script>
